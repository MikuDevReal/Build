name: Build Miku AI APK

on:
  push:
    branches:
      - build
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      # Catatan: project ini HARUS sudah lengkap di repo -
      # pubspec.yaml + folder lib/ + folder android/ (bukan cuma sisa file Android).
      # Tidak ada lagi "flutter create" ulang di sini karena itu menghapus
      # seluruh kode Dart/Miku AI yang sudah ada.
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK tidak ditemukan: $APK"
            find build -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "✅ APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miku-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
